<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NutrIA</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b6e8a">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NutrIA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/page/styles.css">
<script type="module" src="/page/main.js"></script>
</head>
<body>
<header class="topbar">
  <button class="nav-toggle" type="button" id="nav-toggle" aria-controls="side-nav" aria-expanded="true" title="Plegar el menú lateral a solo iconos" aria-label="Plegar el menú lateral a solo iconos">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
  <div class="brand">
    <img class="logo-img" src="/icon-192.png" alt="" width="30" height="30">
    <div>
      <h1>NutrIA</h1>
      <p class="sub">Jira, sesiones y despliegues</p>
    </div>
  </div>
  <div class="top-search" id="top-search"></div>
  <div class="top-right" id="top-right"></div>
</header>
<div class="app">
  <aside class="nav" id="side-nav">
    <div class="brand">
      <img class="logo-img" src="/icon-192.png" alt="" width="30" height="30">
      <div>
        <h1>NutrIA</h1>
        <p class="sub">Jira, sesiones y despliegues</p>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-orientation="vertical" id="tabs"></nav>
  </aside>
  <aside class="report" id="report" aria-label="Reporte de Jira">
    <div class="report-head">
      <button class="report-toggle" type="button" id="report-toggle" aria-controls="report" aria-expanded="true" title="Plegar el reporte de Jira" aria-label="Plegar el reporte de Jira">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <strong>Reporte de Jira</strong>
      <button class="btn bell" type="button" id="pause"></button>
      <button class="btn bell" type="button" id="notifications" hidden></button>
      <button class="btn primary" type="button" id="refresh">Refrescar</button>
    </div>
    <span class="meta" id="stamp"></span>
    <section class="jira" id="report-body" hidden></section>
  </aside>
  <main class="main">
    <div class="main-head">
      <h2 id="view-title"></h2>
      <p class="sub" id="view-sub"></p>
    </div>
    <div class="groups" id="groups" aria-live="polite"></div>
  </main>
</div>
<nav class="bottom" id="bottom" aria-label="Secciones"></nav>
<div class="toast" id="toast" hidden></div>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
