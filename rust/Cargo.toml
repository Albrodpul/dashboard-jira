[package]
name = "tower"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.23.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
flate2 = "1.1.11"
hmac = "0.13.0"
libc = "0.2.191"
p256 = { version = "0.14.0", features = ["ecdh", "ecdsa"] }
portable-pty = "0.9.0"
rand = "0.10.4"
regex = "1.13.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
ryu-js = "1.0.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
tiny_http = "0.12.0"
tungstenite = "0.30.0"
unicode-normalization = "0.1.26"
ureq = { version = "3.5.2", features = ["json"] }
vt100 = "0.18.1"
