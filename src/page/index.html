<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NutrIA</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0b6e8a">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NutrIA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>try { const t = localStorage.getItem("tower-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; if (localStorage.getItem("tower-lang") === "en") document.documentElement.lang = "en"; } catch (e) {}</script>
<link rel="stylesheet" href="/page/styles/base.css">
<link rel="stylesheet" href="/page/styles/layout.css">
<link rel="stylesheet" href="/page/styles/report.css">
<link rel="stylesheet" href="/page/styles/tasks.css">
<link rel="stylesheet" href="/page/styles/home.css">
<link rel="stylesheet" href="/page/styles/sessions.css">
<link rel="stylesheet" href="/page/styles/talk.css">
<link rel="stylesheet" href="/page/styles/deploy.css">
<link rel="stylesheet" href="/page/styles/follow-up.css">
<link rel="stylesheet" href="/page/styles/learning.css">
<link rel="stylesheet" href="/page/styles/misc.css">
<script type="module" src="/page/main.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img class="logo-img" src="/icon-192.png" alt="" width="30" height="30">
    <div>
      <h1>NutrIA</h1>
      <p class="sub" data-t>Jira, sesiones y despliegues</p>
    </div>
  </div>
  <div class="top-search" id="top-search"></div>
  <div class="top-right" id="top-right"></div>
</header>
<div class="app">
  <aside class="nav" id="side-nav">
    <div class="brand">
      <img class="logo-img" src="/icon-192.png" alt="" width="30" height="30">
      <div>
        <h1>NutrIA</h1>
        <p class="sub" data-t>Jira, sesiones y despliegues</p>
      </div>
      <div class="brand-project"></div>
    </div>
    <div class="nav-project" id="nav-project"></div>
    <nav class="tabs" role="tablist" aria-orientation="vertical" id="tabs"></nav>
  </aside>
  <aside class="report" id="report" aria-label="Última actividad" data-t-aria>
    <div class="report-head">
      <strong data-t>Última actividad</strong>
      <span class="report-tools">
        <button class="btn bell" type="button" id="pause"></button>
        <button class="btn bell" type="button" id="notifications" hidden></button>
        <button class="btn bell" type="button" id="refresh" title="Revisar Jira ahora" aria-label="Revisar Jira ahora" data-t-title data-t-aria>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
      </span>
    </div>
    <div class="act-tabs" id="act-tabs" role="tablist" aria-label="Qué actividad ver" data-t-aria></div>
    <span class="meta" id="stamp"></span>
    <span class="meta" id="gh-stamp"></span>
    <section class="jira" id="report-body" hidden></section>
    <section class="jira gh" id="github-body"></section>
  </aside>
  <main class="main">
    <div class="main-head">
      <h2 id="view-title"></h2>
      <p class="sub" id="view-sub"></p>
    </div>
    <div class="groups" id="groups" aria-live="polite"></div>
  </main>
</div>
<nav class="bottom" id="bottom" aria-label="Secciones" data-t-aria></nav>
<div class="toast" id="toast" hidden></div>
<script>
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
